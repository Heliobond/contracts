# cargo-deny configuration: supply-chain policy (advisories, bans, licenses, sources).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Background: `cargo audit` (CI `security` job, added for #101) does not check
# for yanked crates at all, and with no flags it does not fail on
# `unmaintained` advisories either. `cargo deny check` covers both, plus
# license/source/ban policy, against the same Cargo.lock.

[graph]
targets = []
all-features = true

[advisories]
db-path = "~/.cargo/advisory-dbs"
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
# cargo-deny 0.21 Scope::All reports every matching advisory as an error.
# https://github.com/EmbarkStudios/cargo-deny/blob/0.21.0/src/advisories.rs
unmaintained = "all"
unsound = "all"
ignore = [
  # David approved these host/test-only exceptions on 2026-11-16.
  # Both crates are absent from normal wasm32v1-none dependencies.
  # Revisit on every Soroban SDK/host upgrade and remove when upstream is fixed.
  # https://github.com/RustSec/advisory-db/blob/main/crates/crypto-bigint/RUSTSEC-2026-0387.md
  { id = "RUSTSEC-2026-0387", reason = "host/test crypto-bigint 0.5.5 via elliptic-curve 0.13; >=0.7.6 fix incompatible, including latest SDK 29.0.1" },
  # https://rustsec.org/advisories/RUSTSEC-2024-0436
  { id = "RUSTSEC-2024-0436", reason = "host/test paste 1.0.15 via ark-ff and wasmi_core; upstream must migrate to maintained replacement" },
  # spin 0.9.8 yanked on crates.io; transitive via soroban-wasmi ->
  # soroban-env-common/soroban-env-host. Same situation as above: tracked,
  # drop once upstream updates.
  { crate = "spin@0.9.8", reason = "yanked spin 0.9.8, transitive via soroban-wasmi/soroban-env-host; awaiting upstream" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[licenses]
# Current cargo-deny always rejects unlicensed crates and licenses outside
# the explicit allow/exception lists (stronger than the removed warn policy).
# https://github.com/EmbarkStudios/cargo-deny/pull/611
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "CC0-1.0",
  "Zlib",
  "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
