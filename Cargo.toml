[workspace]
resolver = "2"
members = ["project_registry", "investment_vault", "libs/multisig"]

# Runtime/consensus-relevant dependencies are pinned with exact `=` versions
# rather than semver ranges (#421). Soroban WASM output, gas costs, and
# on-chain behavior can all shift on a patch release of the SDK or the
# stellar-* crates, so an update here is a deliberate, reviewed action
# (bump the version, re-audit, re-verify deploy hashes) rather than
# something that should flow in silently via `cargo update`. `cargo-audit`
# (CI's `security` job) still flags a vulnerable pinned version even though
# it can't auto-resolve it -- that's intentional, not a gap to fix by
# loosening these pins.
[workspace.dependencies]
soroban-sdk = { version = "=26.1.0" }
stellar-tokens = { version = "=0.7.2" }
stellar-access = { version = "=0.7.2" }
stellar-macros = { version = "=0.7.2" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# Manual-use-only profile, not referenced by any script/Makefile target/CI job
# (#423): use it locally when you need a release-shaped build (same
# optimization level, size, and gas characteristics as `release`) but with
# debug_assert!/overflow-check-style assertions still active, e.g. to
# reproduce a suspected release-only bug or sanity-check assumptions against
# a near-production build without the noise of a full debug build.
# Build with: `cargo build --profile release-with-logs`
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
