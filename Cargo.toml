[workspace]
resolver = "2"
members = ["project_registry", "investment_vault", "libs/multisig"]

# Runtime/consensus-relevant dependencies use caret ranges (the lockfile
# guarantees reproducibility). Patch-level security fixes can flow in via
# `cargo update` or Dependabot without a manual pin bump (#421, #727).
[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }
stellar-tokens = { version = "0.8.0" }
stellar-access = { version = "0.8.0" }
stellar-macros = { version = "0.8.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true


