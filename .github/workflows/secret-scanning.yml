name: Secret scanning (Gitleaks)

# Repo-side stand-in for GitHub secret scanning + push protection, which are
# currently disabled on this repo. Fails PRs/pushes that introduce secrets.
# To enable the native GitHub features (recommended), an admin can run:
#   bash scripts/enable-github-secret-scanning.sh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep for already-committed secrets.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so the scheduled sweep sees everything

      - name: Install Gitleaks CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks

      - name: Scan diff (PR/push) or full history (schedule)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = schedule ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact
          else
            "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --log-opts="$BASE..$HEAD"
          fi
