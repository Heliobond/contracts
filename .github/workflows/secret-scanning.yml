name: Secret scanning (Gitleaks)

# Repo-side stand-in for GitHub secret scanning + push protection, which are
# currently disabled on this repo. Fails PRs/pushes that introduce secrets.
# To enable the native GitHub features (recommended), an admin can run:
#   bash scripts/enable-github-secret-scanning.sh

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full-history sweep for already-committed secrets.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history so the scheduled sweep sees everything

      - name: Scan diff (PR/push) or full history (schedule)
        uses: gitleaks/gitleaks-action@v8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
