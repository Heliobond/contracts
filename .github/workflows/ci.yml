name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  STELLAR_CLI_VERSION: "26.1.0"
  STELLAR_CLI_SHA256: "e18d5a7629102e1ccc07241acbcbebfc05b1c02476ce7d3204ba2d7418be5c0c"

jobs:
  wave-security:
    uses: ./.github/workflows/wave-security.yml
    permissions:
      contents: read

  test:
    needs: wave-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Test the Wave scanner
        run: python3 -I scripts/test_check_wave.py

      - name: Test verified WASM artifact checks
        run: python3 scripts/tests/test_ci_wasm_artifact.py

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Stellar CLI
        run: |
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o /tmp/stellar-cli.tar.gz "$url"
          echo "${STELLAR_CLI_SHA256}  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Build contracts (wasm)
        # The integration tests `contractimport!` the built wasm, so build first.
        run: stellar contract build

      - name: Lint (clippy)
        run: cargo clippy --all-targets -- -D warnings

      - name: Check INTERFACE.md matches contract exports (#273)
        run: python3 scripts/check_interface_docs.py

      - name: Check shared event field types are consistent (#258)
        run: python3 scripts/check_event_field_types.py

      - name: Test
        run: cargo test --all --quiet

      - name: Test TotalDeposited lifetime TTL regression
        run: |
          cargo test --all --quiet -- --list | grep -q total_deposited_survives_inactivity
          cargo test --all --quiet total_deposited_survives_inactivity -- --include-ignored

      - name: Test check_gas_budgets.py (#250)
        run: make test-gas-budget-check

      - name: Gas profile and budgets (#86, #246)
        run: |
          cargo test --all --quiet cost_estimate -- --nocapture 2>&1 | tee gas-profile.txt
          python3 scripts/check_gas_budgets.py gas-budgets.json gas-profile.txt gas-report.md

      - name: Upload gas report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gas-report-${{ github.sha }}
          path: |
            gas-profile.txt
            gas-report.md

      - name: Check WASM sizes (#100)
        run: |
          echo "Contract WASM sizes:"
          FAILED=0
          # Budget: 128 KiB per contract (Stellar's recommended limit for affordable deployment)
          BUDGET_BYTES=131072
          for f in target/wasm32v1-none/release/*.wasm; do
            name=$(basename "$f" .wasm)
            size=$(wc -c < "$f")
            printf "  %-40s %7d bytes\n" "$name" "$size"
            if [ "$size" -gt "$BUDGET_BYTES" ]; then
              echo "  ❌ $name exceeds ${BUDGET_BYTES}-byte budget by $((size - BUDGET_BYTES)) bytes"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "One or more contracts exceed the WASM size budget. Optimise with wasm-opt -O3."
            exit 1
          fi
          echo "All contracts within budget."

      - name: Bind validated WASM to this main CI run
        if: github.event_name == 'push' && github.repository == 'Heliobond/contracts' && github.ref == 'refs/heads/main'
        run: python3 scripts/ci_wasm_artifact.py create

      - name: Upload validated WASM for post-CI network tests
        if: github.event_name == 'push' && github.repository == 'Heliobond/contracts' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verified-contract-wasm-${{ github.sha }}
          path: |
            target/wasm32v1-none/release/project_registry.wasm
            target/wasm32v1-none/release/investment_vault.wasm
            target/wasm32v1-none/release/verified-wasm.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  notification-service:
    needs: wave-security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: notification-service
    steps:
      - uses: actions/checkout@v7

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          # Single source of truth for the supported Node version (#685).
          node-version-file: notification-service/.nvmrc
          cache: npm
          cache-dependency-path: notification-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint) (#248)
        run: npm run lint

      - name: Format check (prettier) (#248)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  security:
    needs: wave-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install cargo-audit
        # Pinned version: before upgrading, run advisory and ban checks against
        # the new release and verify it parses the committed audit.toml policy
        # without suppressing errors. Update the version here and in the comment
        # together so reviewers see both changes in the same diff.
        run: cargo +stable install cargo-audit@0.23.0 --locked

      - name: Keep approved advisory exceptions outside deployed WASM
        run: |
          cargo tree --locked --target wasm32v1-none --edges normal --prefix none > "$RUNNER_TEMP/wasm-dependencies.txt"
          if grep -E '^(crypto-bigint|paste|spin) v' "$RUNNER_TEMP/wasm-dependencies.txt"; then
            echo "::error::An approved host/test exception entered the deployed WASM dependency graph. Review the exception scope."
            exit 1
          fi

      - name: Security audit
        run: cargo audit --deny unmaintained

      - name: Install cargo-deny
        # Pinned version: before upgrading, run advisory, ban, license and source
        # checks against the new release and verify it parses deny.toml without
        # suppressing policy errors. Update the version here and in the comment
        # together so reviewers see both changes in the same diff.
        run: cargo +stable install cargo-deny@0.21.0 --locked

      - name: Supply-chain checks (advisories, bans, licenses, sources)
        # Audit configuration documents approved host-only upstream exceptions
        # for crypto-bigint, paste and yanked spin via the Soroban toolchain;
        # any new advisory/yanked/ban/license/source drift fails here.
        run: cargo deny check

  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  abi-check:
    needs: wave-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Stellar CLI
        run: |
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o /tmp/stellar-cli.tar.gz "$url"
          echo "${STELLAR_CLI_SHA256}  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar

      - name: Build PR branch contracts
        run: stellar contract build

      - name: Extract PR branch ABI
        run: |
          mkdir -p .abi/pr
          stellar contract inspect --wasm target/wasm32v1-none/release/project_registry.wasm > .abi/pr/project_registry.txt 2>&1
          stellar contract inspect --wasm target/wasm32v1-none/release/investment_vault.wasm > .abi/pr/investment_vault.txt 2>&1

      - name: Setup base branch worktree
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Bootstrap only the known uncompilable main revision against the repaired CI baseline.
          # Remove this case after main advances. Every other base is built without substitution.
          if [ "$BASE_SHA" = cc21876ecc118a0cd75047bc9b775f37dff555e4 ]; then
            BASE_SHA=36c812a62bc6858c866080638f6f053e834f1b06
            echo "::notice::Bootstrapping comparisons from repaired baseline $BASE_SHA"
          fi
          git worktree add --detach /tmp/base "$BASE_SHA"

      - name: Build base branch contracts
        working-directory: /tmp/base
        run: stellar contract build

      - name: Extract base branch ABI
        run: |
          mkdir -p .abi/base
          stellar contract inspect --wasm /tmp/base/target/wasm32v1-none/release/project_registry.wasm > .abi/base/project_registry.txt 2>&1
          stellar contract inspect --wasm /tmp/base/target/wasm32v1-none/release/investment_vault.wasm > .abi/base/investment_vault.txt 2>&1

      - name: Check for breaking ABI changes
        # Removed/changed ABI lines fail; purely additive changes only emit a notice.
        run: bash scripts/check_abi_diff.sh .abi/base .abi/pr project_registry investment_vault

      - name: Upload ABI artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: contract-abi-${{ github.sha }}
          path: .abi/

  docs:
    needs: wave-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Stellar CLI
        run: |
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL -o /tmp/stellar-cli.tar.gz "$url"
          echo "${STELLAR_CLI_SHA256}  /tmp/stellar-cli.tar.gz" | sha256sum -c -
          tar -xzf /tmp/stellar-cli.tar.gz -C /tmp
          sudo mv /tmp/stellar /usr/local/bin/stellar
          stellar --version

      - name: Build contracts for cross-contract documentation imports
        run: stellar contract build

      - name: Generate Documentation
        run: |
          cargo doc --no-deps --all
          # Create redirect index.html
          cat << 'EOF' > target/doc/index.html
          <!DOCTYPE html>
          <html>
          <head>
              <meta http-equiv="refresh" content="0; url=project_registry/index.html">
              <title>Heliobond Contracts Documentation</title>
          </head>
          <body>
              <p>Redirecting to <a href="project_registry/index.html">Project Registry documentation</a>...</p>
              <p>You can also view the <a href="investment_vault/index.html">Investment Vault documentation</a>.</p>
          </body>
          </html>
          EOF

      - name: Upload Documentation Artifact
        uses: actions/upload-artifact@v7
        with:
          name: contracts-documentation-${{ github.sha }}
          path: target/doc/
          retention-days: 14

      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        id: deployment
        uses: actions/deploy-pages@v5

