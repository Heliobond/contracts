name: SDK

# Generate and publish @heliobond/contracts-sdk (#624): TypeScript bindings for
# both contracts plus per-network contract IDs from deploy/*.json, versioned
# from the release tag. Runs alongside changelog.yml on every v* tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: SDK version to publish (e.g. 1.2.0). Defaults to 0.0.0-<sha> (dry run, not published).
        required: false

env:
  STELLAR_CLI_VERSION: "26.1.0"

jobs:
  sdk:
    name: Build & publish contracts SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Stellar CLI
        run: |
          url="https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_CLI_VERSION}/stellar-cli-${STELLAR_CLI_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -sSL "$url" | tar -xz
          sudo mv stellar /usr/local/bin/stellar

      - name: Build contracts
        run: stellar contract build

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@heliobond'

      - name: Generate bindings + networks.ts
        run: scripts/build_sdk.sh "${{ steps.version.outputs.value }}"

      - name: Install & compile SDK
        working-directory: sdk
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Pack SDK
        working-directory: sdk
        run: npm pack

      - name: Upload SDK tarball
        uses: actions/upload-artifact@v4
        with:
          name: heliobond-contracts-sdk-${{ steps.version.outputs.value }}
          path: sdk/*.tgz

      - name: Publish to GitHub Packages
        if: steps.version.outputs.publish == 'true'
        working-directory: sdk
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach SDK tarball to the GitHub release
        if: github.event_name == 'push'
        run: gh release upload "$GITHUB_REF_NAME" sdk/*.tgz --clobber || echo "release not created yet; tarball is in the workflow artifact"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
