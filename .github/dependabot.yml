# Automated dependency update PRs (#679).
# Security-update PRs additionally require "Dependabot security updates" to be
# enabled under Settings → Code security; this file drives version updates.
version: 2
updates:
  # Rust workspace: soroban-sdk and the OZ stellar-* crates are exact-pinned
  # (`=x.y.z`, #421) and must move together, so they're grouped into one PR.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      soroban-stellar:
        patterns:
          - "soroban-*"
          - "stellar-*"

  - package-ecosystem: npm
    directory: /notification-service
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      notification-service-dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      sdk-dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
