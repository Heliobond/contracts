[toolchain]
# Pinned for reproducible WASM builds. Raised from 1.84.0 because Cargo below
# ~1.85 cannot parse the manifest of some of this workspace's dependencies
# (for example enum-ordinalize-derive 4.4.1 and indexmap 2.14.0), which made the
# `docs` and `security` jobs fail with "failed to parse manifest" before any
# check ran.
channel = "1.90.0"
# rustup installs these with the pinned toolchain, so `cargo fmt` and
# `cargo clippy` exist in CI instead of failing with "not installed for the
# toolchain".
components = ["rustfmt", "clippy"]
targets = ["wasm32v1-none"]
